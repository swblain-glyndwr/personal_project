[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "next-ads-lakeflow-runtime"
version = "2.0.0"
description = "NextAds package metadata for Lakeflow pipeline environments."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["next_ads*"]
