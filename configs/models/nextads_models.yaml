models:
  - model_name: analytics_pctr
    provider_id: analytics_pctr
    problem_statement: Rank eligible adverts by click likelihood and account-advert affinity.
    prediction_entity: account and advert
    prediction_time: feature reference date
    label: ad_clicked
    observation_keys:
      - account_number
      - advert_id
      - reference_date
    success_metrics:
      - auc_pr
      - log_loss
      - calibration
    runtime_profile: dbr_15_4_spark_cpu
    training_observation:
      feature_id: next_uk_nextads_fs_pctr_model_input
      observation_timestamp: reference_date
      selected_columns:
        - account_number
        - advert_id
        - reference_date
        - ad_clicked
    trainer: analytics_pctr_two_stage_xgboost
    score_provider: analytics_pctr_two_stage_scores
    candidate_adapter: account_advert_ranked_candidates
    activation_mode: EVALUATE
    feature_lookups:
      - feature_id: next_uk_nextads_fs_pctr_model_input
        observation_timestamp: reference_date
        key_mapping:
          account_number: account_number
          advert_id: advert_id
        selected_columns:
          - cash_acc
          - advert_ctr
          - device_ctr
          - geo_ctr
          - gender_ctr
          - dod_ctr_change
          - wow_ctr_change
          - age
          - number_pages_viewed
          - prior_30_day_order_value
          - customer_total_clicks
          - customer_total_unique_adverts_clicked
          - customer_advert_previous_click_number
          - number_clicks_same_algodivision
          - advert_impressions
          - device_impressions
          - geo_impressions
          - gender_impressions
          - day_impressions
          - prior_day_impressions
          - view_theme_score
          - perc_order_value_cat_affinity
          - perc_30_day_order_value_cat_affinity
          - perc_order_qty_cat_affinity
          - view_highest_catid_weight
          - view_lift_adjusted
          - purchase_highest_catid_weight
          - purchase_lift_adjusted
          - purchase_theme_affinity
        defaults:
          customer_total_clicks: 0
          customer_total_unique_adverts_clicked: 0
          customer_advert_previous_click_number: 0
          number_clicks_same_algodivision: 0
          advert_impressions: 0
          device_impressions: 0
          geo_impressions: 0
          gender_impressions: 0
          day_impressions: 0
          prior_day_impressions: 0
          view_highest_catid_weight: 0.0
          view_lift_adjusted: 0.0
          purchase_highest_catid_weight: 0.0
          purchase_lift_adjusted: 0.0
          purchase_theme_affinity: 0.0
  - model_name: shopping_bag_pctr
    provider_id: shopping_bag_pctr
    problem_statement: Rank eligible web Shopping Bag adverts by the likelihood of a click after an observed impression in the same session.
    prediction_entity: account and advert
    prediction_time: observed web Shopping Bag advert exposure
    label: clicked
    observation_keys:
      - exposure_id
      - label_horizon_days
    success_metrics:
      - auc_pr
      - auc_roc
      - log_loss
      - calibration_gap
      - lift_at_5_percent
    runtime_profile: dbr_15_4_spark_cpu
    training_observation:
      feature_id: next_uk_nextads_fs_shopping_bag_click_labels
      observation_timestamp: exposure_timestamp
      observation_date_column: session_date
      selected_columns:
        - exposure_id
        - account_number
        - advert_id
        - location
        - session_date
        - exposure_timestamp
        - route
        - platform
        - placement_rank
        - device
        - operating_system
        - page_surface
        - treatment
        - label_horizon_days
        - label_maturity_date
        - label_is_mature
        - impression_count
        - clicked
      context_features:
        - location
      label_maturity_column: label_maturity_date
      filters:
        route: v1
        platform: WEB
        label_horizon_days: 0
        label_is_mature: true
        impression_count: 1
    trainer: shopping_bag_pctr_spark
    score_provider: shopping_bag_pctr_scores
    candidate_adapter: account_advert_ranked_candidates
    evaluation_use_case: shopping_bag_advert_ranking
    evaluation_scope:
      route:
        - v1
      location:
        - SB1
        - SB2
    activation_mode: EVALUATE
    research:
      evaluation_schema_version: binary_classifier_evidence/v1
      temporal_split:
        train:
          start: 2026-08-05
          end: 2026-08-08
        validate:
          start: 2026-08-09
          end: 2026-08-10
        test:
          start: 2026-08-11
          end: 2026-08-11
      candidates:
        - candidate_id: logistic_regression
          plugin: spark_logistic_regression
          seed: 1729
          failure_allowed: false
          parameters:
            maxIter: 50
            regParam: 0.01
            elasticNetParam: 0.0
        - candidate_id: random_forest
          plugin: spark_random_forest
          seed: 1729
          failure_allowed: false
          parameters:
            numTrees: 120
            maxDepth: 8
            minInstancesPerNode: 20
        - candidate_id: gradient_boosted_trees
          plugin: spark_gradient_boosted_trees
          seed: 1729
          failure_allowed: false
          parameters:
            maxIter: 60
            maxDepth: 5
            stepSize: 0.05
        - candidate_id: spark_xgboost
          plugin: spark_xgboost
          seed: 1729
          failure_allowed: false
          parameters:
            eval_metric: aucpr
            max_depth: 6
            learning_rate: 0.05
            n_estimators: 150
            subsample: 0.8
            colsample_bytree: 0.8
            num_workers: 4
      evaluation_rules:
        required_metrics:
          - auc_pr
          - prevalence
          - auc_roc
          - log_loss
          - observed_click_rate
          - predicted_click_rate
          - calibration_gap
          - precision_at_1_percent
          - recall_at_1_percent
          - lift_at_1_percent
          - precision_at_5_percent
          - recall_at_5_percent
          - lift_at_5_percent
          - precision_at_10_percent
          - recall_at_10_percent
          - lift_at_10_percent
        required_evidence:
          - precision_recall_curve
          - roc_curve
          - calibration
          - lift_and_cumulative_gain
          - score_distributions
          - top_fraction_confusion
          - slice_metrics
          - feature_importance
          - missingness_and_default_coverage
          - candidate_comparison
        top_fractions:
          - 0.01
          - 0.05
          - 0.10
        confidence_interval_metrics:
          - auc_pr
          - lift_at_5_percent
        confidence_level: 0.95
        confidence_interval_resamples: 1000
        confidence_interval_seed: 1729
        minimum_slice_rows: 100
        prevalence_baseline: true
      slices:
        - slice_id: shopping_bag_location
          column: location
          values:
            - SB1
            - SB2
          minimum_rows: 100
        - slice_id: device
          column: device
          if_present: true
          minimum_rows: 100
      selection_policy: REVIEW_REQUIRED
      minimum_successful_candidates: 4
      explanation_requirements:
        - global_feature_importance
        - readable_feature_names
        - model_specific_or_permutation
      candidate_search:
        plugin: databricks_automl_classification
        enabled: false
        timeout_minutes: 30
    feature_lookups:
      - feature_id: next_uk_nextads_fs_shopping_bag_account_activity_90d
        observation_timestamp: exposure_timestamp
        availability_lag_days: 1
        key_mapping:
          account_number: account_number
        selected_columns:
          - browse_sessions_90d
          - browse_active_days_90d
          - page_events_90d
          - shopping_bag_page_events_90d
          - avg_pages_per_session_90d
          - action_events_90d
          - add_to_bag_actions_90d
          - browse_session_recency_days
          - action_recency_days
        defaults:
          browse_sessions_90d: 0
          browse_active_days_90d: 0
          page_events_90d: 0
          shopping_bag_page_events_90d: 0
          avg_pages_per_session_90d: 0.0
          action_events_90d: 0
          add_to_bag_actions_90d: 0
          browse_session_recency_days: 91
          action_recency_days: 91
      - feature_id: next_uk_nextads_fs_advert_core_daily
        observation_timestamp: exposure_timestamp
        key_mapping:
          advert_id: advert_id
          location: location
        selected_columns:
          - campaign_id
          - advert_theme
          - advert_category
          - advert_brand_name
          - template_name
