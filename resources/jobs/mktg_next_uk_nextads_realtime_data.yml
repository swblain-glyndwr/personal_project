mktg_next_uk_nextads_config: &mktg_next_uk_nextads_realtime_data
  mktg_next_uk_nextads_realtime_data_cicd:
    name: mktg_next_uk_nextads_realtime_data
    queue:
      enabled: true
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    schedule:
      quartz_cron_expression: 0 0 23 * * ?
      timezone_id: Europe/London
    timeout_seconds: 21600 # required by Engineering at job level as Monitoring Dashboard doesnt handle for_each_task type
    tasks:
      - task_key: build_advert_affinity_data
        spark_python_task:
          python_file: ../../jobs/realtime/decisioning/advert_advert_affinity.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --reference-date
            - "{{job.start_time.iso_date}}"
            - --history-data-weighting
            - 0.75
            - --lift-threshold
            - 1.1
            - --ad-coverage-threshold
            - 0.85
        job_cluster_key: next_ads_job_cluster_E16ds_v5_4_pctr
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 7200
targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_realtime_data
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_realtime_data
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_realtime_data
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_realtime_data
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_realtime_data
