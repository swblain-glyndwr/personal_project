mktg_next_uk_nextads_predict_data_prep_config: &mktg_next_uk_nextads_predict_data_prep_config
  nextads_theme_affinity_predict_data_prep:
    name: nextads_theme_affinity_predict_data_prep
    configuration:
      pipeline.schema: ${var.theme_affinity_pipeline_schema}
      pipeline.job_env: ${var.job_parameter_environment_name}
      pipeline.table_prefix: next_uk_nextads_account_theme_foundation_stage
      pipeline.sql_path: ${workspace.file_path}/src/next_ads/ranking/theme_affinity/sql
      pipeline.context_table: ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_scoring_foundation_run_contexts
      pipeline.context_slot: account_theme_features_v2
      pipeline.item_themes_table: ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_scoring_input_item_themes
    clusters: ${var.pipeline_clusters_config}
    libraries:
      - glob:
          include: ${workspace.file_path}/src/next_ads/ranking/theme_affinity/dlt_pipeline.py
    schema: ${var.theme_affinity_pipeline_schema}
    edition: CORE
    catalog: ${var.mktgdata_catalog}
    root_path: ${workspace.file_path}/src
    environment: ${var.pipeline_libraries}

targets:
  SANDBOX:
    resources:
      pipelines:
        <<: *mktg_next_uk_nextads_predict_data_prep_config
  DEV:
    resources:
      pipelines:
        <<: *mktg_next_uk_nextads_predict_data_prep_config
  DEV_INTEGRATION:
    resources:
      pipelines:
        <<: *mktg_next_uk_nextads_predict_data_prep_config
  PREPROD:
    resources:
      pipelines:
        <<: *mktg_next_uk_nextads_predict_data_prep_config
  PROD:
    resources:
      pipelines:
        <<: *mktg_next_uk_nextads_predict_data_prep_config
