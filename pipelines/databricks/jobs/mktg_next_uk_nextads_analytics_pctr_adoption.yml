# Manual DEV proof that adopts the existing Analytics pCTR output as EVALUATE.
analytics_pctr_adoption_job: &analytics_pctr_adoption_job
  name: mktg_next_uk_nextads_analytics_pctr_adoption
  queue:
    enabled: true
  parameters:
    - name: source_table
      default: ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_analytics_pctr_predictions_latest
    - name: source_delta_version
      default: REQUIRED
    - name: run_date
      default: REQUIRED
    - name: producing_run_id
      default: REQUIRED
    - name: receipt_catalog
      default: ${var.mktgdata_catalog}
    - name: receipt_schema
      default: ${var.user_schema}
    - name: evaluation_scores_table
      default: ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_model_evaluation_scores
    - name: classifier_model_uri
      default: models:/marketingdata_dev.ds_sandbox.nextads_analytics_pctr_popularity_classification_model/2
    - name: classifier_run_id
      default: 4323ac0b3ffa4b099be19b47a90885ba
    - name: regressor_model_uri
      default: models:/marketingdata_dev.ds_sandbox.nextads_analytics_pctr_affinity_regression_model/2
    - name: regressor_run_id
      default: 5063f0209c1140fd9dee917052c171ac
  job_clusters: ${var.job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: model_development
    model: analytics_pctr
    activation_mode: EVALUATE
  max_concurrent_runs: 1
  timeout_seconds: 7200
  tasks:
    - task_key: adopt_exact_analytics_pctr_output
      spark_python_task:
        python_file: ../../../jobs/model/development/adopt_analytics_pctr.py
        parameters:
          - --source_table
          - "{{job.parameters.source_table}}"
          - --source_delta_version
          - "{{job.parameters.source_delta_version}}"
          - --run_date
          - "{{job.parameters.run_date}}"
          - --producing_run_id
          - "{{job.parameters.producing_run_id}}"
          - --receipt_catalog
          - "{{job.parameters.receipt_catalog}}"
          - --receipt_schema
          - "{{job.parameters.receipt_schema}}"
          - --evaluation_scores_table
          - "{{job.parameters.evaluation_scores_table}}"
          - --classifier_model_uri
          - "{{job.parameters.classifier_model_uri}}"
          - --classifier_run_id
          - "{{job.parameters.classifier_run_id}}"
          - --regressor_model_uri
          - "{{job.parameters.regressor_model_uri}}"
          - --regressor_run_id
          - "{{job.parameters.regressor_run_id}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.model_development_libraries}
      timeout_seconds: 7200

analytics_pctr_adoption_config: &analytics_pctr_adoption_config
  mktg_next_uk_nextads_analytics_pctr_adoption:
    <<: *analytics_pctr_adoption_job

targets:
  DEV:
    resources:
      jobs:
        <<: *analytics_pctr_adoption_config
