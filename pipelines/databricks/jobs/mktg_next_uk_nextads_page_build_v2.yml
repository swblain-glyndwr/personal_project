mktg_next_uk_nextads_page_build_config_v2: &mktg_next_uk_nextads_page_build_config_v2
  mktg_next_uk_nextads_page_build_cicd_v2:
    name: mktg_next_uk_nextads_page_build_v2
    queue:
      enabled: true
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
    email_notifications:
      on_failure: ${var.data_and_downstream_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    timeout_seconds: 21600 # required by Engineering at job level as Monitoring Dashboard doesnt handle for_each_task type
    parameters:
      - name: run_date
        default: "{{job.start_time.iso_date}}"
      - name: build_run_id
        default: "v2_{{job.run_id}}"
    tasks:
      - task_key: build_page_v2
        for_each_task:
          inputs: '["HomePage", "ShoppingBagPage", "CheckoutPage", "ProductListingPage", "ForYouPage"]'
          concurrency: 10
          task:
            task_key: build_page_v2_iteration
            spark_python_task:
              python_file: ../../../jobs/nextads_v2/build_page.py
              parameters:
                - --client
                - "next_uk"
                - --job_env
                - ${var.job_parameter_environment_name}
                - --page_type
                - "{{input}}"
                - --run_date
                - "{{job.parameters.run_date}}"
                - --build_run_id
                - "{{job.parameters.build_run_id}}"
            job_cluster_key: next_ads_job_cluster_D32ads_v5_4_4_photon
            libraries: ${var.shared_libraries}
            max_retries: 2
            min_retry_interval_millis: 5000
            timeout_seconds: 10800
      - task_key: trigger_payload_export_job
        depends_on:
          - task_key: build_page_v2
        run_if: ALL_DONE
        spark_python_task:
          python_file: ../../../jobs/orchestration/trigger_databricks_job.py
          parameters:
            - --job-id
            - ${resources.jobs.mktg_next_uk_nextads_payload_export_cicd.id}
            - --job-name
            - "mktg_next_uk_nextads_payload_export"
            - --fail-on-submit-error
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 3600
targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_page_build_config_v2
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_page_build_config_v2
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_page_build_config_v2
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_page_build_config_v2
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_page_build_config_v2
