# Offline Next Ads feature-store setup and materialisation job.
# Personal targets stay manual/paused; DEV_FEATURE_STORE is the shared scheduled
# model-building feature store in marketingdata_dev.nextads_feature_store.
nextads_feature_store_job: &nextads_feature_store_job
  name: mktg_next_uk_nextads_feature_store
  queue:
    enabled: true
  parameters:
    - name: reference_date
      default: ${var.feature_store_reference_date}
    - name: source_catalog
      default: ${var.feature_store_source_catalog}
    - name: source_schema
      default: ${var.feature_store_source_schema}
    - name: theme_source_catalog
      default: ${var.feature_store_theme_source_catalog}
    - name: theme_source_schema
      default: ${var.feature_store_theme_source_schema}
    - name: theme_table_prefix
      default: ${var.feature_store_theme_table_prefix}
    - name: theme_training_reference_date
      default: ${var.feature_store_theme_training_reference_date}
    - name: analytics_pctr_source_binding
      default: ${var.feature_store_analytics_pctr_source_binding}
    - name: analytics_pctr_source_schema
      default: ${var.feature_store_analytics_pctr_source_schema}
    - name: recreate_feature_tables
      default: "false"
  job_clusters: ${var.job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: feature_store
  # Covers the inlined source-build gate and the longest downstream materialisation
  # while ending before the next 21:00 daily schedule.
  timeout_seconds: 82800
  max_concurrent_runs: 1
  tasks:
    - task_key: resolve_feature_store_reference_date
      spark_python_task:
        python_file: ../../../jobs/features/nextads/resolve_feature_reference_date.py
        parameters:
          - --reference_date
          - "{{job.parameters.reference_date}}"
          - --source_catalog
          - "{{job.parameters.source_catalog}}"
          - --source_schema
          - "{{job.parameters.source_schema}}"
          - --theme_source_catalog
          - "{{job.parameters.theme_source_catalog}}"
          - --theme_source_schema
          - "{{job.parameters.theme_source_schema}}"
          - --theme_table_prefix
          - "{{job.parameters.theme_table_prefix}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.feature_store_libraries}
      timeout_seconds: 1800
    - task_key: create_feature_store_tables
      depends_on:
        - task_key: resolve_feature_store_reference_date
      spark_python_task:
        python_file: ../../../jobs/table_operations/create_feature_store_tables.py
        parameters:
          - --catalog
          - ${var.mktgdata_catalog}
          - --schema
          - ${var.feature_store_schema}
          - --manage_principal
          - ${var.run_as_SPN_name}
          - --all_privileges_principal
          - AzUsers-DBK-MarketingData-Contributor-Dev
          - --all_privileges_principal
          - AzUsers-AADPAG-DBK-MKT-CatalogContributor-Dev
          - --recreate_tables
          - "{{job.parameters.recreate_feature_tables}}"
          - --empty_scaffold_migration
          - next_uk_nextads_fs_product_embeddings_latest
          - --empty_scaffold_migration
          - next_uk_nextads_fs_advert_semantic_profile_daily
          - --empty_scaffold_migration
          - next_uk_nextads_fs_advert_product_profile_daily
          - --empty_scaffold_migration
          - next_uk_nextads_fs_seasonal_product_demand_daily
          - --empty_scaffold_migration
          - next_uk_nextads_fs_account_advert_affinity_daily
          - --empty_scaffold_migration
          - next_uk_nextads_fs_pctr_model_input
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.feature_store_libraries}
      timeout_seconds: 7200
    - task_key: preflight_feature_store_sources
      depends_on:
        - task_key: create_feature_store_tables
        - task_key: receipt_analytics_pctr_feature_source
      spark_python_task:
        python_file: ../../../jobs/features/nextads/preflight_checks.py
        parameters:
          - --catalog
          - ${var.mktgdata_catalog}
          - --schema
          - ${var.feature_store_schema}
          - --reference_date
          - "{{tasks.resolve_feature_store_reference_date.values.reference_date}}"
          - --source_catalog
          - "{{job.parameters.source_catalog}}"
          - --source_schema
          - "{{job.parameters.source_schema}}"
          - --theme_source_catalog
          - "{{job.parameters.theme_source_catalog}}"
          - --theme_source_schema
          - "{{job.parameters.theme_source_schema}}"
          - --theme_table_prefix
          - "{{job.parameters.theme_table_prefix}}"
