# Manual PROD-only access reconciliation job. The recipients and namespace are
# fixed in source; the only runtime controls are an inert dry run and an
# explicit mutation confirmation.
nextads_prod_table_access_config: &nextads_prod_table_access_config
  mktg_next_uk_nextads_prod_table_access:
    name: mktg_next_uk_nextads_prod_table_access
    queue:
      enabled: true
    max_concurrent_runs: 1
    parameters:
      - name: confirm_mutating
        default: "false"
      - name: dry_run
        default: "true"
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
      purpose: prod_sp_owned_table_access
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    timeout_seconds: 3600
    tasks:
      - task_key: grant_prod_sp_owned_table_access
        spark_python_task:
          python_file: ../../../jobs/table_operations/grant_sp_owned_table_access.py
          parameters:
            - --job_env
            - ${var.job_parameter_environment_name}
            - --catalog
            - ${var.mktgdata_catalog}
            - --schema
            - ${var.user_schema}
            - --expected_owner
            - ${var.run_as_SPN_name}
            - --confirm_mutating
            - "{{job.parameters.confirm_mutating}}"
            - --dry_run
            - "{{job.parameters.dry_run}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        timeout_seconds: 3600

targets:
  PROD:
    resources:
      jobs:
        <<: *nextads_prod_table_access_config
