# Manual DEV proof for the existing Analytics pCTR prediction script only.
analytics_pctr_prediction_verification_job: &analytics_pctr_prediction_verification_job
  name: mktg_next_uk_nextads_analytics_pctr_prediction_verification
  queue:
    enabled: true
  parameters:
    - name: catalog_schema_prefix
      default: ${var.mktgdata_catalog}.${var.user_schema}
    - name: table_prefix
      default: next_uk_nextAds_analytics_pctr
    - name: lookback_period
      default: "30"
    - name: affinity_weighting_factor
      default: "4"
    - name: regressor_model_uri
      default: models:/marketingdata_dev.ds_sandbox.nextads_analytics_pctr_affinity_regression_model/2
    - name: classifier_model_uri
      default: models:/marketingdata_dev.ds_sandbox.nextads_analytics_pctr_popularity_classification_model/2
  job_clusters: ${var.job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: model_development
    model: analytics_pctr
    activation_mode: EVALUATE
  max_concurrent_runs: 1
  timeout_seconds: 7200
  tasks:
    - task_key: score_existing_analytics_pctr_model
      spark_python_task:
        python_file: ${workspace.file_path}/experiments/analytics_pctr/run_predictions.py
        parameters:
          - --catalog_schema_prefix
          - "{{job.parameters.catalog_schema_prefix}}"
          - --table_prefix
          - "{{job.parameters.table_prefix}}"
          - --lookback_period
          - "{{job.parameters.lookback_period}}"
          - --affinity_weighting_factor
          - "{{job.parameters.affinity_weighting_factor}}"
          - --regressor_model_uri
          - "{{job.parameters.regressor_model_uri}}"
          - --classifier_model_uri
          - "{{job.parameters.classifier_model_uri}}"
      job_cluster_key: next_ads_job_cluster_E16ds_v5_4_pctr
      libraries: ${var.analytics_pctr_libraries}
      timeout_seconds: 7200

analytics_pctr_prediction_verification_config: &analytics_pctr_prediction_verification_config
  mktg_next_uk_nextads_analytics_pctr_prediction_verification:
    <<: *analytics_pctr_prediction_verification_job

targets:
  DEV:
    resources:
      jobs:
        <<: *analytics_pctr_prediction_verification_config
