# Manual DEV-only comparison of declared candidates from one exact training receipt.
model_research_job: &model_research_job
  name: mktg_next_uk_nextads_model_research
  queue:
    enabled: true
  parameters:
    - name: model_name
      default: shopping_bag_pctr
    - name: feature_catalog
      default: ${var.mktgdata_catalog}
    - name: feature_schema
      default: ${var.feature_store_schema}
    - name: model_catalog
      default: ${var.mktgdata_catalog}
    - name: model_schema
      default: ${var.user_schema}
    - name: train_reference_dates
      default: REQUIRED
    - name: validation_reference_dates
      default: REQUIRED
    - name: test_reference_dates
      default: REQUIRED
    - name: feature_reference_dates
      default: REQUIRED
    - name: label_end
      default: REQUIRED
    - name: registered_model_name
      default: ${var.mktgdata_catalog}.${var.user_schema}.nextads_shopping_bag_pctr
    - name: experiment_path
      default: ${workspace.root_path}/shopping_bag_pctr_research
    - name: selection_mode
      default: REVIEW_REQUIRED
  job_clusters: ${var.model_research_job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: model_research
    activation_mode: EVALUATE
  max_concurrent_runs: 1
  timeout_seconds: 21600
  tasks:
    - task_key: smoke_model_research_runtime
      spark_python_task:
        python_file: ../../../jobs/model/research/smoke_model_research_runtime.py
        parameters:
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_model_research_D32ads_v5_4
      libraries: ${var.model_research_libraries}
      timeout_seconds: 1800
    - task_key: run_declared_model_research
      depends_on:
        - task_key: smoke_model_research_runtime
      spark_python_task:
        python_file: ../../../jobs/model/research/run_declared_research.py
        parameters:
          - --model_name
          - "{{job.parameters.model_name}}"
          - --feature_catalog
          - "{{job.parameters.feature_catalog}}"
          - --feature_schema
          - "{{job.parameters.feature_schema}}"
          - --model_catalog
          - "{{job.parameters.model_catalog}}"
          - --model_schema
          - "{{job.parameters.model_schema}}"
          - --train_reference_dates
          - "{{job.parameters.train_reference_dates}}"
          - --validation_reference_dates
          - "{{job.parameters.validation_reference_dates}}"
          - --test_reference_dates
          - "{{job.parameters.test_reference_dates}}"
          - --feature_reference_dates
          - "{{job.parameters.feature_reference_dates}}"
          - --label_end
          - "{{job.parameters.label_end}}"
          - --registered_model_name
          - "{{job.parameters.registered_model_name}}"
          - --experiment_path
          - "{{job.parameters.experiment_path}}"
          - --selection_mode
          - "{{job.parameters.selection_mode}}"
          - --code_sha
          - ${var.git_commit_sha}
          - --orchestration_run_id
          - "{{job.run_id}}"
          - --task_run_id
          - "{{task.run_id}}"
          - --execution_count
          - "{{task.execution_count}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_model_research_D32ads_v5_4
      libraries: ${var.model_research_libraries}
      timeout_seconds: 19800

model_research_config: &model_research_config
  mktg_next_uk_nextads_model_research:
    <<: *model_research_job

targets:
  DEV:
    resources:
      jobs:
        <<: *model_research_config
