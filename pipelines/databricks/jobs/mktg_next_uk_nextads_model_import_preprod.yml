# Release-branch-only import of one exact generic model into PREPROD.
model_import_preprod_config: &model_import_preprod_config
  mktg_next_uk_nextads_model_import_preprod:
    name: mktg_next_uk_nextads_model_import_preprod
    queue:
      enabled: true
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
      domain: model_lifecycle
      job_type: model_import_dev_integration_to_preprod
    timeout_seconds: 1800
    parameters:
      - name: source_model_name
        default: ""
      - name: source_model_version
        default: ""
      - name: source_alias
        default: ""
      - name: target_model_name
        default: ""
      - name: target_alias
        default: preprod_candidate
      - name: model_family
        default: ""
    tasks:
      - task_key: promote_exact_model
        spark_python_task:
          python_file: ../../../jobs/model/development/promote_exact_model.py
          parameters:
            - --client
            - next_uk
            - --model_family
            - "{{job.parameters.model_family}}"
            - --source_environment
            - dev_integration
            - --target_environment
            - preprod
            - --source_model_name
            - "{{job.parameters.source_model_name}}"
            - --source_model_version
            - "{{job.parameters.source_model_version}}"
            - --source_alias
            - "{{job.parameters.source_alias}}"
            - --target_model_name
            - "{{job.parameters.target_model_name}}"
            - --target_alias
            - "{{job.parameters.target_alias}}"
            - --allowed_source_model_prefix
            - marketingdata_dev.nextads_integration.
            - --allowed_target_model_prefix
            - marketingdata_prod.ds_sandbox.
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.model_lifecycle_libraries}
        timeout_seconds: 1800

targets:
  PREPROD:
    resources:
      jobs:
        <<: *model_import_preprod_config
