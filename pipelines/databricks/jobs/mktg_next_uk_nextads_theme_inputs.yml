mktg_next_uk_nextads_theme_inputs_config: &mktg_next_uk_nextads_theme_inputs_config
  mktg_next_uk_nextads_theme_inputs_cicd:
    name: mktg_next_uk_nextads_theme_inputs
    queue:
      enabled: true
    max_concurrent_runs: 1
    schedule:
      quartz_cron_expression: 0 15 12 * * ?
      timezone_id: Europe/London
    parameters:
      - name: run_date
        default: "{{job.start_time.iso_date}}"
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
      purpose: scoring_inputs
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    timeout_seconds: 7200
    tasks:
      - task_key: land_authoritative_theme_mapping
        spark_python_task:
          python_file: ../../../jobs/nextads_control/land_scoring_theme_mapping.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --git_commit
            - ${var.git_commit_sha}
            - --task_run_id
            - "{{task.run_id}}"
            - --execution_count
            - "{{task.execution_count}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 1800
      - task_key: refresh_item_attributes
        spark_python_task:
          python_file: ../../../jobs/nextads_control/parse_attributes.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --refresh_attributes_date
            - "2026-06-15"
            - --run_date
            - "{{job.parameters.run_date}}"
        job_cluster_key: next_ads_job_cluster_D16ads_v5_4_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 1800
      - task_key: build_authoritative_item_themes
        depends_on:
          - task_key: refresh_item_attributes
          - task_key: land_authoritative_theme_mapping
        spark_python_task:
          python_file: ../../../jobs/nextads_control/parse_theme_mapping.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --refresh_themes_date
            - "2026-06-15"
            - --refresh_theme_mapping
            - "true"
            - --theme_mapping_config
            - theme_mapping_v2
            - --run_date
            - "{{job.parameters.run_date}}"
            - --theme_mapping_table
            - ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_scoring_input_theme_mapping_raw
            - --theme_mapping_landing_id
            - "{{tasks.land_authoritative_theme_mapping.values.landing_id}}"
            - --theme_mapping_version
            - "{{tasks.land_authoritative_theme_mapping.values.landing_version}}"
        job_cluster_key: next_ads_job_cluster_D16ads_v5_4_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 3600
      - task_key: accept_scoring_inputs
        depends_on:
          - task_key: build_authoritative_item_themes
        spark_python_task:
          python_file: ../../../jobs/nextads_control/accept_scoring_inputs.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --task_run_id
            - "{{task.run_id}}"
            - --execution_count
            - "{{task.execution_count}}"
            - --theme_mapping_landing_id
            - "{{tasks.land_authoritative_theme_mapping.values.landing_id}}"
            - --theme_mapping_landing_version
            - "{{tasks.land_authoritative_theme_mapping.values.landing_version}}"
            - --warning_count
            - "{{tasks.land_authoritative_theme_mapping.values.warning_count}}"
            - --git_commit
            - ${var.git_commit_sha}
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D16ads_v5_4_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 900

targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_inputs_config
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_inputs_config
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_inputs_config
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_inputs_config
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_inputs_config
