# Manual DEV-only scoring over the accepted Shopping Bag candidate builds.
shopping_bag_ongoing_evaluation_job: &shopping_bag_ongoing_evaluation_job
  name: mktg_next_uk_nextads_shopping_bag_ongoing_evaluation
  queue:
    enabled: true
  parameters:
    - name: model_build_id
      default: REQUIRED
    - name: run_date
      default: "{{job.start_time.iso_date}}"
    - name: feature_catalog
      default: ${var.mktgdata_catalog}
    - name: feature_schema
      default: ${var.feature_store_schema}
    - name: feature_reference_dates
      default: AUTO
    - name: model_catalog
      default: ${var.mktgdata_catalog}
    - name: model_schema
      default: ${var.user_schema}
    - name: candidate_builds_table
      default: ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_candidate_builds
    - name: candidate_scores_table
      default: ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_candidate_scores
    - name: candidate_ad_sets_table
      default: ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_candidate_ad_sets
    - name: v1_candidate_build_attempt_id
      default: AUTO
    - name: v2_candidate_build_attempt_id
      default: AUTO
    - name: candidate_serving_slot
      default: best
  job_clusters: ${var.job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: model_development
    model: shopping_bag_pctr
    activation_mode: EVALUATE
    evidence_scope: ongoing_candidate_scoring
  max_concurrent_runs: 1
  timeout_seconds: 10800
  tasks:
    - task_key: score_exact_shopping_bag_candidates
      spark_python_task:
        python_file: ../../../jobs/model/development/run_shopping_bag_ongoing_evaluation.py
        parameters:
          - --model_name
          - shopping_bag_pctr
          - --model_build_id
          - "{{job.parameters.model_build_id}}"
          - --run_date
          - "{{job.parameters.run_date}}"
          - --feature_catalog
          - "{{job.parameters.feature_catalog}}"
          - --feature_schema
          - "{{job.parameters.feature_schema}}"
          - --feature_reference_dates
          - "{{job.parameters.feature_reference_dates}}"
          - --model_catalog
          - "{{job.parameters.model_catalog}}"
          - --model_schema
          - "{{job.parameters.model_schema}}"
          - --candidate_builds_table
          - "{{job.parameters.candidate_builds_table}}"
          - --candidate_scores_table
          - "{{job.parameters.candidate_scores_table}}"
          - --candidate_ad_sets_table
          - "{{job.parameters.candidate_ad_sets_table}}"
          - --v1_candidate_build_attempt_id
          - "{{job.parameters.v1_candidate_build_attempt_id}}"
          - --v2_candidate_build_attempt_id
          - "{{job.parameters.v2_candidate_build_attempt_id}}"
          - --candidate_serving_slot
          - "{{job.parameters.candidate_serving_slot}}"
          - --code_sha
          - ${var.git_commit_sha}
          - --orchestration_run_id
          - "{{job.run_id}}"
          - --task_run_id
          - "{{task.run_id}}"
          - --execution_count
          - "{{task.execution_count}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.model_development_libraries}
      timeout_seconds: 10800

shopping_bag_ongoing_evaluation_config: &shopping_bag_ongoing_evaluation_config
  mktg_next_uk_nextads_shopping_bag_ongoing_evaluation:
    <<: *shopping_bag_ongoing_evaluation_job

targets:
  DEV:
    resources:
      jobs:
        <<: *shopping_bag_ongoing_evaluation_config
