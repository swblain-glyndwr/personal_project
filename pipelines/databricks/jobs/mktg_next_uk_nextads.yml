mktg_next_uk_nextads_config: &mktg_next_uk_nextads_config
  mktg_next_uk_nextads_cicd:
    name: mktg_next_uk_nextads_candidate_build
    queue:
      enabled: true
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    schedule:
      quartz_cron_expression: 0 0 18 * * ?
      timezone_id: Europe/London
    timeout_seconds: 21600 # required by Engineering at job level as Monitoring Dashboard doesnt handle for_each_task type
    parameters:
      - name: run_date
        default: "{{job.start_time.iso_date}}"
    tasks:
      - task_key: assign_customer_cells
        spark_python_task:
          python_file: ../../../jobs/nextads_cells/assign_customer_cells.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --refresh_control_date
            - "2026-01-08"
            # - --sample_mode
            # - "True"
        job_cluster_key: next_ads_job_cluster_D32ads_v5_4_4_photon
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 7200
      - task_key: combine_customer_cells
        depends_on:
          - task_key: assign_customer_cells
        spark_python_task:
          python_file: ../../../jobs/nextads_cells/combine_customer_cells.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
        job_cluster_key: next_ads_job_cluster_D32ads_v5_4_4_photon
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 3600
      - task_key: load_control_sheet_v1
        spark_python_task:
          python_file: ../../../jobs/nextads_control/load_control_sheet.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        # adding retry due to transient issues (e.g. Google API)
        max_retries: 2
        min_retry_interval_millis: 300000
        timeout_seconds: 3600
      - task_key: audit_control_sheet_v1
        depends_on:
          - task_key: load_control_sheet_v1
        spark_python_task:
          python_file: ../../../jobs/nextads_control/audit_control_sheet.py
          parameters:
            - --route
            - "v1"
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --warn-only
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 1800
      - task_key: trigger_data_pull_for_CMS_pull
        run_job_task:
          job_id: ${resources.jobs.mktg_next_uk_nextads_data_pull.id}
          job_parameters:
            run_date: "{{job.parameters.run_date}}"
      - task_key: load_control_sheet_v2
        depends_on:
          - task_key: trigger_data_pull_for_CMS_pull
        spark_python_task:
          python_file: ../../../jobs/nextads_control/load_control_sheet_v2.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        # adding retry due to transient issues (e.g. Google API)
        max_retries: 2
        min_retry_interval_millis: 300000
        timeout_seconds: 3600
      - task_key: audit_control_sheet_v2
        depends_on:
          - task_key: load_control_sheet_v2
        spark_python_task:
          python_file: ../../../jobs/nextads_control/audit_control_sheet.py
          parameters:
            - --route
            - "v2"
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --warn-only
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 1800
      - task_key: validate_theme_affinity_theme_coverage
        depends_on:
          - task_key: load_control_sheet_v1
          - task_key: load_control_sheet_v2
        spark_python_task:
          python_file: ../../../jobs/nextads_candidates/validate_theme_affinity_theme_coverage.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --warn-only
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 1800
      - task_key: map_theme_scores_to_ads_v1
        depends_on:
          - task_key: combine_customer_cells
          - task_key: load_control_sheet_v1
        spark_python_task:
          python_file: ../../../jobs/nextads_candidates/build_theme_ad_candidates.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --apply-ad-feedback
            - --top-ads-per-location
            - "100"
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 10800
      - task_key: map_theme_scores_to_ads_v2
        depends_on:
          - task_key: combine_customer_cells
          - task_key: load_control_sheet_v2
        spark_python_task:
          python_file: ../../../jobs/nextads_candidates/build_page_type_candidates_v2.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --top-ads-per-page-type
            - "100"
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 10800
      - task_key: trigger_page_build_v1_job
        depends_on:
          - task_key: combine_customer_cells
          - task_key: map_theme_scores_to_ads_v1
        spark_python_task:
          python_file: ../../../jobs/orchestration/trigger_databricks_job.py
          parameters:
            - --job-id
            - ${resources.jobs.mktg_next_uk_nextads_page_build_cicd.id}
            - --job-name
            - "mktg_next_uk_nextads_page_build"
            - --job-parameter
            - "run_date={{job.parameters.run_date}}"
            - --fail-on-submit-error
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 3600
      - task_key: trigger_page_build_v2_job
        depends_on:
          - task_key: combine_customer_cells
          - task_key: map_theme_scores_to_ads_v2
        spark_python_task:
          python_file: ../../../jobs/orchestration/trigger_databricks_job.py
          parameters:
            - --job-id
            - ${resources.jobs.mktg_next_uk_nextads_page_build_cicd_v2.id}
            - --job-name
            - "mktg_next_uk_nextads_page_build_v2"
            - --job-parameter
            - "run_date={{job.parameters.run_date}}"
            - --fail-on-submit-error
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 3600

targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_config
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_config
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_config
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_config
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_config
