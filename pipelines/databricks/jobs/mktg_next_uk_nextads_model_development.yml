# Shared manual DEV entry point for declared model lifecycle operations.
model_development_job: &model_development_job
  name: mktg_next_uk_nextads_model_development
  queue:
    enabled: true
  parameters:
    - name: operation
      default: REQUIRED
    - name: model_name
      default: REQUIRED
    - name: observation_reference_dates
      default: ""
    - name: feature_reference_dates
      default: ""
    - name: label_end
      default: ""
    - name: research_build_id
      default: ""
    - name: candidate_id
      default: ""
    - name: written_reason
      default: ""
    - name: reviewed_by
      default: ""
    - name: model_build_id
      default: ""
    - name: run_date
      default: ""
    - name: evaluation_account_limit
      default: ""
    - name: evaluation_serving_slot
      default: ""
    - name: evaluation_candidate_build_attempt_id
      default: ""
  job_clusters: ${var.model_research_job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: model_development
    activation_mode: EVALUATE
  max_concurrent_runs: 1
  timeout_seconds: 21600
  tasks:
    - task_key: run_declared_model_operation
      spark_python_task:
        python_file: ../../../jobs/model/development/run_declared_model_operation.py
        parameters:
          - --operation
          - "{{job.parameters.operation}}"
          - --model_name
          - "{{job.parameters.model_name}}"
          - --feature_catalog
          - ${var.mktgdata_catalog}
          - --feature_schema
          - ${var.feature_store_schema}
          - --model_catalog
          - ${var.mktgdata_catalog}
          - --model_schema
          - ${var.user_schema}
          - --experiment_root
          - ${workspace.root_path}/model_development
          - --observation_reference_dates
          - "{{job.parameters.observation_reference_dates}}"
          - --feature_reference_dates
          - "{{job.parameters.feature_reference_dates}}"
          - --label_end
          - "{{job.parameters.label_end}}"
          - --research_build_id
          - "{{job.parameters.research_build_id}}"
          - --candidate_id
          - "{{job.parameters.candidate_id}}"
          - --written_reason
          - "{{job.parameters.written_reason}}"
          - --reviewed_by
          - "{{job.parameters.reviewed_by}}"
          - --model_build_id
          - "{{job.parameters.model_build_id}}"
          - --run_date
          - "{{job.parameters.run_date}}"
          - --evaluation_account_limit
          - "{{job.parameters.evaluation_account_limit}}"
          - --evaluation_serving_slot
          - "{{job.parameters.evaluation_serving_slot}}"
          - --evaluation_candidate_build_attempt_id
          - "{{job.parameters.evaluation_candidate_build_attempt_id}}"
          - --code_sha
          - ${var.git_commit_sha}
          - --orchestration_run_id
          - "{{job.run_id}}"
          - --task_run_id
          - "{{task.run_id}}"
          - --execution_count
          - "{{task.execution_count}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_model_research_D32ads_v5_4
      libraries: ${var.model_research_libraries}
      timeout_seconds: 21600

model_development_config: &model_development_config
  mktg_next_uk_nextads_model_development:
    <<: *model_development_job

targets:
  DEV:
    resources:
      jobs:
        <<: *model_development_config
