# Manual DEV proof for a model built from declared Feature Store inputs.
model_development_job: &model_development_job
  name: mktg_next_uk_nextads_model_development
  queue:
    enabled: true
  parameters:
    - name: model_name
      default: shopping_bag_pctr
    - name: feature_catalog
      default: ${var.mktgdata_catalog}
    - name: feature_schema
      default: ${var.feature_store_schema}
    - name: feature_reference_dates
      default: REQUIRED
    - name: label_end
      default: REQUIRED
    - name: registered_model_name
      default: ${var.mktgdata_catalog}.${var.user_schema}.nextads_shopping_bag_pctr
    - name: experiment_path
      default: /Shared/mlflow/nextads/dev/experiments/shopping_bag_pctr
    - name: evaluation_scores_table
      default: ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_model_evaluation_scores
    - name: promotion_model_name
      default: ""
    - name: promotion_alias
      default: integration_candidate
  job_clusters: ${var.job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: model_development
    activation_mode: EVALUATE
  max_concurrent_runs: 1
  timeout_seconds: 10800
  tasks:
    - task_key: build_train_and_score_declared_model
      spark_python_task:
        python_file: ../../../jobs/model/development/run_declared_model.py
        parameters:
          - --model_name
          - "{{job.parameters.model_name}}"
          - --feature_catalog
          - "{{job.parameters.feature_catalog}}"
          - --feature_schema
          - "{{job.parameters.feature_schema}}"
          - --feature_reference_dates
          - "{{job.parameters.feature_reference_dates}}"
          - --label_end
          - "{{job.parameters.label_end}}"
          - --code_sha
          - ${var.git_commit_sha}
          - --registered_model_name
          - "{{job.parameters.registered_model_name}}"
          - --experiment_path
          - "{{job.parameters.experiment_path}}"
          - --evaluation_scores_table
          - "{{job.parameters.evaluation_scores_table}}"
          - --promotion_model_name
          - "{{job.parameters.promotion_model_name}}"
          - --promotion_alias
          - "{{job.parameters.promotion_alias}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.model_development_libraries}
      timeout_seconds: 10800

model_development_config: &model_development_config
  mktg_next_uk_nextads_model_development:
    <<: *model_development_job

targets:
  DEV:
    resources:
      jobs:
        <<: *model_development_config
