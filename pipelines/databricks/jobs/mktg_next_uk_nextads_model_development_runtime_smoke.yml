# Manual, read-only proof of the DBR 15.4 model-development runtime.
model_development_runtime_smoke_job: &model_development_runtime_smoke_job
  name: mktg_next_uk_nextads_model_development_runtime_smoke
  queue:
    enabled: true
  job_clusters: ${var.job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: model_development
    activation_mode: EVALUATE
  max_concurrent_runs: 1
  timeout_seconds: 1800
  tasks:
    - task_key: validate_runtime_and_future_lookup_guard
      spark_python_task:
        python_file: ../../../jobs/model/development/smoke_model_development_runtime.py
      job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
      libraries: ${var.model_development_libraries}
      timeout_seconds: 1800

model_development_runtime_smoke_config: &model_development_runtime_smoke_config
  mktg_next_uk_nextads_model_development_runtime_smoke:
    <<: *model_development_runtime_smoke_job

targets:
  DEV:
    resources:
      jobs:
        <<: *model_development_runtime_smoke_config
