mktg_next_uk_nextads_table_maintenance_config: &mktg_next_uk_nextads_table_maintenance_config
  mktg_next_uk_nextads_table_maintenance_cicd:
    name: mktg_next_uk_nextads_table_maintenance
    queue:
      enabled: true
    schedule:
      quartz_cron_expression: "0 0 5 * * ?"
      timezone_id: Europe/London
    parameters:
      - name: run_date
        default: "{{job.start_time.iso_date}}"
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
      purpose: table_maintenance
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    timeout_seconds: 14400
    tasks:
      - task_key: maintain_nextads_tables
        spark_python_task:
          python_file: ../../../jobs/table_operations/table_maintenance.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D16ads_v5_4_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        min_retry_interval_millis: 5000
        timeout_seconds: 14400

targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_table_maintenance_config
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_table_maintenance_config
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_table_maintenance_config
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_table_maintenance_config
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_table_maintenance_config
