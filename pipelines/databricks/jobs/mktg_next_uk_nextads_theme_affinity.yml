mktg_next_uk_nextads_theme_affinity_config: &mktg_next_uk_nextads_theme_affinity_config
  mktg_next_uk_nextads_theme_affinity_cicd:
    name: mktg_next_uk_nextads_theme_affinity
    queue:
      enabled: true
    max_concurrent_runs: 1
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
      domain: theme_affinity
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    schedule:
      quartz_cron_expression: 0 0 13 * * ?
      timezone_id: Europe/London
    timeout_seconds: 21600
    parameters:
      - name: run_date
        default: "{{job.start_time.iso_date}}"
      - name: input_snapshot_id
        default: same_day
      - name: publish_source_namespace
        default: ${var.mktgdata_catalog}.${var.theme_affinity_pipeline_schema}
      - name: publish_target_namespace
        default: ${var.mktgdata_catalog}.${var.user_schema}
      - name: publish_source_table_prefix
        default: next_uk_nextads_account_theme_foundation_stage
      - name: publish_target_table_prefix
        default: next_uk_nextads_theme_affinity_predict
      - name: compatibility_table_suffixes
        default: ${var.theme_affinity_publish_table_suffixes}
      - name: model_uri
        default: ${var.theme_affinity_model_uri}
    tasks:
      - task_key: prepare_foundation_context
        spark_python_task:
          python_file: ../../../jobs/orchestration/prepare_scoring_foundation_context.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --input_snapshot_id
            - "{{job.parameters.input_snapshot_id}}"
            - --foundation_id
            - account_theme_features
            - --context_slot
            - account_theme_features_v2
            - --readiness_wait_seconds
            - "5400"
            - --readiness_poll_seconds
            - "60"
            - --task_run_id
            - "{{task.run_id}}"
            - --execution_count
            - "{{task.execution_count}}"
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        timeout_seconds: 6600
      - task_key: predict_data_prep
        depends_on:
          - task_key: prepare_foundation_context
        pipeline_task:
          pipeline_id: ${resources.pipelines.nextads_theme_affinity_predict_data_prep.id}
          full_refresh: false
        timeout_seconds: 18000
      - task_key: publish_foundation
        depends_on:
          - task_key: predict_data_prep
        spark_python_task:
          python_file: ../../../jobs/orchestration/publish_scoring_foundation.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --context_slot
            - account_theme_features_v2
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --source_namespace
            - "{{job.parameters.publish_source_namespace}}"
            - --source_table_prefix
            - "{{job.parameters.publish_source_table_prefix}}"
            - --target_namespace
            - "{{job.parameters.publish_target_namespace}}"
            - --target_table_prefix
            - "{{job.parameters.publish_target_table_prefix}}"
            - --pipeline_id
            - ${resources.pipelines.nextads_theme_affinity_predict_data_prep.id}
            - --pipeline_task_run_id
            - "{{tasks.predict_data_prep.run_id}}"
            - --task_run_id
            - "{{task.run_id}}"
            - --execution_count
            - "{{task.execution_count}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        min_retry_interval_millis: 60000
        timeout_seconds: 5400
      - task_key: publish_compatibility_outputs
        depends_on:
          - task_key: predict_data_prep
        spark_python_task:
          python_file: ../../../jobs/model/theme_affinity/publish_outputs.py
          parameters:
            - --source_namespace
            - "{{job.parameters.publish_source_namespace}}"
            - --target_namespace
            - "{{job.parameters.publish_target_namespace}}"
            - --table_prefix
            - "{{job.parameters.publish_source_table_prefix}}"
            - --target_table_prefix
            - "{{job.parameters.publish_target_table_prefix}}"
            - --table_suffixes
            - "{{job.parameters.compatibility_table_suffixes}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        min_retry_interval_millis: 60000
        timeout_seconds: 5400
      - task_key: prepare_provider_context
        depends_on:
          - task_key: publish_foundation
        spark_python_task:
          python_file: ../../../jobs/orchestration/prepare_score_provider_context.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --input_snapshot_id
            - "{{tasks.publish_foundation.values.input_snapshot_id}}"
            - --model_uri
            - "{{job.parameters.model_uri}}"
            - --context_slot
            - theme_affinity_serving
            - --readiness_wait_seconds
            - "0"
            - --readiness_poll_seconds
            - "60"
            - --task_run_id
            - "{{task.run_id}}"
            - --execution_count
            - "{{task.execution_count}}"
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --scoring_foundation_build_id
            - "{{tasks.publish_foundation.values.scoring_foundation_build_id}}"
            - --scoring_foundation_build_attempt_id
            - "{{tasks.publish_foundation.values.scoring_foundation_build_attempt_id}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        timeout_seconds: 900
      - task_key: model_predict
        depends_on:
          - task_key: prepare_provider_context
        spark_python_task:
          python_file: ../../../jobs/model/theme_affinity/model_predict.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --model_uri
            - "{{job.parameters.model_uri}}"
            - --run_date
            - "{{job.parameters.run_date}}"
            - --input_snapshot_id
            - "{{tasks.prepare_provider_context.values.input_snapshot_id}}"
            - --provider_build_id
            - "{{tasks.prepare_provider_context.values.provider_build_id}}"
            - --provider_build_attempt_id
            - "{{tasks.prepare_provider_context.values.provider_build_attempt_id}}"
            - --context_slot
            - theme_affinity_serving
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        min_retry_interval_millis: 60000
        timeout_seconds: 10800
      - task_key: sense_check_dlt_data
        depends_on:
          - task_key: predict_data_prep
        spark_python_task:
          python_file: ../../../jobs/model/theme_affinity/sense_check.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --check_scope
            - data
            - --baseline_intermediate_namespace
            - marketingdata_prod.ds_sandbox
            - --baseline_intermediate_prefix
            - next_uk_nextAds_predict_prod
            - --candidate_intermediate_namespace
            - ${var.mktgdata_catalog}.${var.theme_affinity_pipeline_schema}
            - --candidate_intermediate_prefix
            - "{{job.parameters.publish_source_table_prefix}}"
            - --summary_table
            - ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_theme_affinity_dlt_sense_check_summary
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        min_retry_interval_millis: 60000
        timeout_seconds: 5400
      - task_key: clean_output
        depends_on:
          - task_key: model_predict
        spark_python_task:
          python_file: ../../../jobs/model/theme_affinity/clean_output.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --input_snapshot_id
            - "{{tasks.prepare_provider_context.values.input_snapshot_id}}"
            - --provider_build_id
            - "{{tasks.prepare_provider_context.values.provider_build_id}}"
            - --provider_build_attempt_id
            - "{{tasks.prepare_provider_context.values.provider_build_attempt_id}}"
            - --prediction_delta_version
            - "{{tasks.model_predict.values.prediction_delta_version}}"
            - --context_slot
            - theme_affinity_serving
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        min_retry_interval_millis: 60000
        timeout_seconds: 5400
      - task_key: publish_provider_build
        depends_on:
          - task_key: clean_output
        spark_python_task:
          python_file: ../../../jobs/orchestration/publish_score_provider_build.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --input_snapshot_id
            - "{{tasks.prepare_provider_context.values.input_snapshot_id}}"
            - --provider_build_id
            - "{{tasks.prepare_provider_context.values.provider_build_id}}"
            - --provider_build_attempt_id
            - "{{tasks.prepare_provider_context.values.provider_build_attempt_id}}"
            - --provider_signals_delta_version
            - "{{tasks.clean_output.values.provider_signals_delta_version}}"
            - --context_slot
            - theme_affinity_serving
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --task_run_id
            - "{{task.run_id}}"
            - --execution_count
            - "{{task.execution_count}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        min_retry_interval_millis: 60000
        timeout_seconds: 5400
      - task_key: sense_check_model_outputs
        depends_on:
          - task_key: publish_provider_build
        spark_python_task:
          python_file: ../../../jobs/model/theme_affinity/sense_check.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --check_scope
            - model_outputs
            - --baseline_intermediate_namespace
            - marketingdata_prod.ds_sandbox
            - --baseline_intermediate_prefix
            - next_uk_nextAds_predict_prod
            - --baseline_final_table
            - marketingdata_prod.ds_sandbox.next_uk_next_ads_hackathon_model_full
            - --summary_table
            - ${var.mktgdata_catalog}.${var.user_schema}.next_uk_nextads_theme_affinity_model_sense_check_summary
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        min_retry_interval_millis: 60000
        timeout_seconds: 5400
      - task_key: finalize_foundation_context
        depends_on:
          - task_key: publish_foundation
        run_if: ALL_DONE
        spark_python_task:
          python_file: ../../../jobs/orchestration/finalize_scoring_foundation_context.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --context_slot
            - account_theme_features_v2
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --status
            - FAILED
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        timeout_seconds: 900
      - task_key: finalize_provider_context
        depends_on:
          - task_key: publish_provider_build
        run_if: ALL_DONE
        spark_python_task:
          python_file: ../../../jobs/orchestration/finalize_score_provider_context.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --context_slot
            - theme_affinity_serving
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --status
            - FAILED
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.theme_affinity_libraries}
        max_retries: 1
        timeout_seconds: 900

targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_affinity_config
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_affinity_config
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_affinity_config
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_affinity_config
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_theme_affinity_config
