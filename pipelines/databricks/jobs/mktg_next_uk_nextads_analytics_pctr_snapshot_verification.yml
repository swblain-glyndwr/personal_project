# Personal DEV proof for the Analytics pCTR Feature Store publication path.
analytics_pctr_snapshot_verification_job: &analytics_pctr_snapshot_verification_job
  name: mktg_next_uk_nextads_analytics_pctr_snapshot_verification
  queue:
    enabled: true
  parameters:
    - name: reference_date
      default: ${var.feature_store_reference_date}
    - name: feature_catalog
      default: ${var.mktgdata_catalog}
    - name: feature_schema
      default: ${var.feature_store_schema}
    - name: source_catalog
      default: ${var.feature_store_source_catalog}
    - name: source_schema
      default: ${var.feature_store_source_schema}
    - name: theme_source_catalog
      default: ${var.feature_store_theme_source_catalog}
    - name: theme_source_schema
      default: ${var.feature_store_theme_source_schema}
    - name: theme_table_prefix
      default: ${var.feature_store_theme_table_prefix}
    - name: analytics_pctr_source_binding
      default: ${var.feature_store_analytics_pctr_source_binding}
    - name: analytics_pctr_source_catalog
      default: ${var.mktgdata_catalog}
    - name: analytics_pctr_source_schema
      default: ${var.feature_store_analytics_pctr_source_schema}
    - name: analytics_pctr_receipt_correlation_id
      default: REQUIRED
    - name: failure_injection
      default: none
    - name: expect_current_attempt_ready
      default: "true"
  job_clusters: ${var.job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: feature_store_verification
  max_concurrent_runs: 1
  timeout_seconds: 10800
  tasks:
    - task_key: prepare_pctr_feature_tables
      spark_python_task:
        python_file: ../../../jobs/table_operations/create_feature_store_tables.py
        parameters:
          - --catalog
          - "{{job.parameters.feature_catalog}}"
          - --schema
          - "{{job.parameters.feature_schema}}"
          - --recreate_tables
          - "false"
          - --create_views
          - "false"
          - --table
          - next_uk_nextads_fs_account_advert_affinity_daily
          - --table
          - next_uk_nextads_fs_pctr_model_input
          - --table
          - next_uk_nextads_fs_session_context_daily
          - --empty_scaffold_migration
          - next_uk_nextads_fs_account_advert_affinity_daily
          - --empty_scaffold_migration
          - next_uk_nextads_fs_pctr_model_input
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.feature_store_libraries}
      timeout_seconds: 3600
    - task_key: publish_pctr_feature_snapshot
      depends_on:
        - task_key: prepare_pctr_feature_tables
      spark_python_task:
        python_file: ../../../jobs/features/nextads/build_pctr_affinity_features.py
        parameters:
          - --catalog
          - "{{job.parameters.feature_catalog}}"
          - --schema
          - "{{job.parameters.feature_schema}}"
          - --reference_date
          - "{{job.parameters.reference_date}}"
          - --source_catalog
          - "{{job.parameters.source_catalog}}"
          - --source_schema
          - "{{job.parameters.source_schema}}"
          - --theme_source_catalog
          - "{{job.parameters.theme_source_catalog}}"
          - --theme_source_schema
          - "{{job.parameters.theme_source_schema}}"
          - --theme_table_prefix
          - "{{job.parameters.theme_table_prefix}}"
          - --analytics_pctr_source_binding
          - "{{job.parameters.analytics_pctr_source_binding}}"
          - --analytics_pctr_source_catalog
          - "{{job.parameters.analytics_pctr_source_catalog}}"
          - --analytics_pctr_source_schema
          - "{{job.parameters.analytics_pctr_source_schema}}"
          - --analytics_pctr_receipt_correlation_id
          - "{{job.parameters.analytics_pctr_receipt_correlation_id}}"
          - --feature_build_id
          - "{{job.run_id}}"
          - --feature_build_attempt_id
          - "{{job.run_id}}"
          - --git_commit
          - ${var.git_commit_sha}
          - --publish_ready_snapshot
          - "true"
          - --failure_injection
          - "{{job.parameters.failure_injection}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.feature_store_libraries}
      timeout_seconds: 7200
    - task_key: verify_readable_ready_snapshot
      depends_on:
        - task_key: publish_pctr_feature_snapshot
      run_if: ALL_DONE
      spark_python_task:
        python_file: ../../../jobs/features/nextads/verify_pctr_feature_snapshot.py
        parameters:
          - --catalog
          - "{{job.parameters.feature_catalog}}"
          - --schema
          - "{{job.parameters.feature_schema}}"
          - --reference_date
          - "{{job.parameters.reference_date}}"
          - --current_attempt_id
          - "{{job.run_id}}"
          - --expect_current_attempt_ready
          - "{{job.parameters.expect_current_attempt_ready}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.feature_store_libraries}
      timeout_seconds: 1800

analytics_pctr_snapshot_verification_config: &analytics_pctr_snapshot_verification_config
  mktg_next_uk_nextads_analytics_pctr_snapshot_verification:
    <<: *analytics_pctr_snapshot_verification_job

targets:
  DEV:
    resources:
      jobs:
        <<: *analytics_pctr_snapshot_verification_config
