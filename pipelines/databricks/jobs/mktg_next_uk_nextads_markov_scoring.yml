mktg_next_uk_nextads_markov_scoring_config: &mktg_next_uk_nextads_markov_scoring_config
  mktg_next_uk_nextads_markov_scoring_cicd:
    name: mktg_next_uk_nextads_markov_scoring
    queue:
      enabled: true
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    schedule:
      quartz_cron_expression: 0 0 18 * * ?
      timezone_id: Europe/London
    timeout_seconds: 8100 # 18:00 schedule plus the 20:15 completion deadline
    parameters:
      - name: refresh_theme_mapping
        default: "false"
    tasks:
      - task_key: parse_attributes
        spark_python_task:
          python_file: ../../../jobs/nextads_control/parse_attributes.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --refresh_attributes_date
            - "2026-06-15"
        job_cluster_key: next_ads_job_cluster_D16ads_v5_4_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 7200
      - task_key: validate_theme_mapping_sync
        spark_python_task:
          python_file: ../../../jobs/nextads_control/validate_theme_mapping_sync.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        min_retry_interval_millis: 300000
        timeout_seconds: 1800
      - task_key: parse_theme_mapping
        depends_on:
          - task_key: parse_attributes
          - task_key: validate_theme_mapping_sync
        spark_python_task:
          python_file: ../../../jobs/nextads_control/parse_theme_mapping.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --refresh_themes_date
            - "2026-06-15"
            - --refresh_theme_mapping
            - "{{job.parameters.refresh_theme_mapping}}"
        job_cluster_key: next_ads_job_cluster_D16ads_v5_4_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 3600
      - task_key: score_lightweight
        depends_on:
          - task_key: parse_theme_mapping
        spark_python_task:
          python_file: ../../../jobs/nextads_candidates/build_theme_scores.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --refresh_model_date
            - "2026-05-11"
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 18000

targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
