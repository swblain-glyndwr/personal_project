mktg_next_uk_nextads_markov_scoring_config: &mktg_next_uk_nextads_markov_scoring_config
  mktg_next_uk_nextads_markov_scoring_cicd:
    name: mktg_next_uk_nextads_markov_scoring
    queue:
      enabled: true
    max_concurrent_runs: 1
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    schedule:
      quartz_cron_expression: 0 0 18 * * ?
      timezone_id: Europe/London
    timeout_seconds: 8100 # 18:00 schedule plus the 20:15 completion deadline
    parameters:
      - name: run_date
        default: "{{job.start_time.iso_date}}"
      - name: input_snapshot_id
        default: same_day
    tasks:
      - task_key: prepare_provider_context
        spark_python_task:
          python_file: ../../../jobs/orchestration/prepare_score_provider_context.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --input_snapshot_id
            - "{{job.parameters.input_snapshot_id}}"
            - --model_uri
            - code:/markov/v1
            - --context_slot
            - markov_scoring
            - --provider_id
            - markov
            - --use_case
            - theme_ranking
            - --readiness_wait_seconds
            - "60"
            - --readiness_poll_seconds
            - "30"
            - --task_run_id
            - "{{task.run_id}}"
            - --execution_count
            - "{{task.execution_count}}"
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 900
      - task_key: score_lightweight
        depends_on:
          - task_key: prepare_provider_context
        spark_python_task:
          python_file: ../../../jobs/nextads_candidates/build_theme_scores.py
          parameters:
            - --client
            - "next_uk"
            - --job_env
            - ${var.job_parameter_environment_name}
            - --refresh_model_date
            - "2026-05-11"
            - --run_date
            - "{{job.parameters.run_date}}"
            - --input_snapshot_id
            - "{{tasks.prepare_provider_context.values.input_snapshot_id}}"
            - --provider_build_id
            - "{{tasks.prepare_provider_context.values.provider_build_id}}"
            - --provider_build_attempt_id
            - "{{tasks.prepare_provider_context.values.provider_build_attempt_id}}"
            - --context_slot
            - markov_scoring
            - --orchestration_run_id
            - "{{job.run_id}}"
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 18000
      - task_key: complete_provider_context
        depends_on:
          - task_key: score_lightweight
        spark_python_task:
          python_file: ../../../jobs/orchestration/finalize_score_provider_context.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --context_slot
            - markov_scoring
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --status
            - CONSUMED
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 1
        timeout_seconds: 900
      - task_key: finalize_provider_context
        depends_on:
          - task_key: complete_provider_context
        run_if: ALL_DONE
        spark_python_task:
          python_file: ../../../jobs/orchestration/finalize_score_provider_context.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --context_slot
            - markov_scoring
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --status
            - FAILED
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D4ads_v5_1_1
        libraries: ${var.shared_libraries}
        max_retries: 1
        timeout_seconds: 900

targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
