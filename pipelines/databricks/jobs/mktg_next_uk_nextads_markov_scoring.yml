mktg_next_uk_nextads_markov_scoring_config: &mktg_next_uk_nextads_markov_scoring_config
  mktg_next_uk_nextads_markov_scoring_cicd:
    name: mktg_next_uk_nextads_markov_scoring
    queue:
      enabled: true
    max_concurrent_runs: 1
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    schedule:
      quartz_cron_expression: 0 0 13 * * ?
      timezone_id: Europe/London
    timeout_seconds: 26100
    parameters:
      - name: run_date
        default: "{{job.start_time.iso_date}}"
      - name: input_snapshot_id
        default: same_day
    tasks:
      - task_key: build_and_publish_markov
        spark_python_task:
          python_file: ../../../jobs/nextads_candidates/build_theme_scores.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --refresh_model_date
            - "2026-05-11"
            - --run_date
            - "{{job.parameters.run_date}}"
            - --input_snapshot_id
            - "{{job.parameters.input_snapshot_id}}"
            - --context_slot
            - markov_scoring
            - --orchestration_run_id
            - "{{job.run_id}}"
            - --task_run_id
            - "{{task.run_id}}"
            - --execution_count
            - "{{task.execution_count}}"
            - --git_commit
            - ${var.git_commit_sha}
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.shared_libraries}
        max_retries: 2
        timeout_seconds: 18000
      - task_key: publish_markov_compatibility
        depends_on:
          - task_key: build_and_publish_markov
        spark_python_task:
          python_file: ../../../jobs/orchestration/publish_provider_compatibility.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --provider_id
            - markov
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.shared_libraries}
        max_retries: 1
        min_retry_interval_millis: 60000
        timeout_seconds: 5400

targets:
  SANDBOX:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  DEV:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  PREPROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
  PROD:
    resources:
      jobs:
        <<: *mktg_next_uk_nextads_markov_scoring_config
