mktg_next_uk_nextads_candidate_compatibility_config: &candidate_compatibility
  mktg_next_uk_nextads_candidate_compatibility_cicd:
    name: mktg_next_uk_nextads_candidate_compatibility
    queue:
      enabled: true
    max_concurrent_runs: 1
    job_clusters: ${var.job_clusters_config}
    tags:
      deployed_at: ${var.deploy_timestamp}
      git_commit: ${var.git_commit_sha}
      git_branch: ${var.git_branch}
      deployed_by: ${var.deployed_by}
      department: marketing
      project: nextads
      domain: candidate_compatibility
    email_notifications:
      on_failure: ${var.data_team_notification_emails}
    notification_settings:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
    schedule:
      quartz_cron_expression: 0 0 21 * * ?
      timezone_id: Europe/London
    timeout_seconds: 7200
    parameters:
      - name: run_date
        default: "{{job.start_time.iso_date}}"
    tasks:
      - task_key: publish_v1_compatibility
        spark_python_task:
          python_file: ../../../jobs/orchestration/publish_candidate_compatibility.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --route
            - v1
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.shared_libraries}
        max_retries: 1
        timeout_seconds: 5400
      - task_key: publish_v2_compatibility
        spark_python_task:
          python_file: ../../../jobs/orchestration/publish_candidate_compatibility.py
          parameters:
            - --client
            - next_uk
            - --job_env
            - ${var.job_parameter_environment_name}
            - --run_date
            - "{{job.parameters.run_date}}"
            - --route
            - v2
            - --log_level
            - INFO
        job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
        libraries: ${var.shared_libraries}
        max_retries: 1
        timeout_seconds: 5400
      - task_key: assignment_quality_monitor
        depends_on:
          - task_key: publish_v1_compatibility
          - task_key: publish_v2_compatibility
        run_job_task:
          job_id: ${resources.jobs.mktg_next_uk_nextads_assignment_validation_cicd.id}
          job_parameters:
            run_date: "{{job.parameters.run_date}}"

targets:
  SANDBOX:
    resources:
      jobs:
        <<: *candidate_compatibility
  DEV:
    resources:
      jobs:
        <<: *candidate_compatibility
  DEV_INTEGRATION:
    resources:
      jobs:
        <<: *candidate_compatibility
  PREPROD:
    resources:
      jobs:
        <<: *candidate_compatibility
  PROD:
    resources:
      jobs:
        <<: *candidate_compatibility
