# Source-only Analytics pCTR feature build used by the offline Feature Store.
analytics_pctr_feature_source_job: &analytics_pctr_feature_source_job
  name: mktg_next_uk_nextads_analytics_pctr_feature_source
  queue:
    enabled: true
  parameters:
    - name: reference_date
      default: ${var.feature_store_reference_date}
    - name: output_catalog
      default: ${var.mktgdata_catalog}
    - name: output_schema
      default: ${var.feature_store_analytics_pctr_source_schema}
    - name: source_binding
      default: ${var.feature_store_analytics_pctr_source_binding}
    - name: source_catalog
      default: ${var.feature_store_source_catalog}
    - name: source_schema
      default: ${var.feature_store_source_schema}
    - name: theme_source_catalog
      default: ${var.feature_store_theme_source_catalog}
    - name: theme_source_schema
      default: ${var.feature_store_theme_source_schema}
    - name: theme_table_prefix
      default: ${var.feature_store_theme_table_prefix}
    - name: receipt_correlation_id
      default: "{{job.run_id}}"
  job_clusters: ${var.job_clusters_config}
  tags:
    deployed_at: ${var.deploy_timestamp}
    git_commit: ${var.git_commit_sha}
    git_branch: ${var.git_branch}
    deployed_by: ${var.deployed_by}
    department: marketing
    project: nextads
    domain: feature_store_source
  max_concurrent_runs: 1
  timeout_seconds: 25200
  tasks:
    - task_key: resolve_reference_date
      spark_python_task:
        python_file: ../../../jobs/features/nextads/resolve_feature_reference_date.py
        parameters:
          - --reference_date
          - "{{job.parameters.reference_date}}"
          - --source_catalog
          - "{{job.parameters.source_catalog}}"
          - --source_schema
          - "{{job.parameters.source_schema}}"
          - --theme_source_catalog
          - "{{job.parameters.theme_source_catalog}}"
          - --theme_source_schema
          - "{{job.parameters.theme_source_schema}}"
          - --theme_table_prefix
          - "{{job.parameters.theme_table_prefix}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.feature_store_libraries}
      timeout_seconds: 1800
    - task_key: base_sessions
      depends_on:
        - task_key: resolve_reference_date
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/00_base_sessions
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          start_date: "{{tasks.resolve_reference_date.values.reference_date}}"
          end_date: "{{tasks.resolve_reference_date.values.reference_date}}"
          lookback_period: "30"
          year_lookback_period: "365"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 3600
    - task_key: core_datasets
      depends_on:
        - task_key: base_sessions
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/01_core_datasets
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          start_date: "{{tasks.resolve_reference_date.values.reference_date}}"
          end_date: "{{tasks.resolve_reference_date.values.reference_date}}"
          lookback_period: "30"
          year_lookback_period: "365"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 7200
    - task_key: customer_advert_base
      depends_on:
        - task_key: core_datasets
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/02_customer_advert_base-predictions
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          lookback_period: "30"
          year_lookback_period: "365"
          start_date: "{{tasks.resolve_reference_date.values.reference_date}}"
          end_date: "{{tasks.resolve_reference_date.values.reference_date}}"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 3600
    - task_key: session_aggregation
      depends_on:
        - task_key: customer_advert_base
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/03_session_aggregation
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          lookback_period: "30"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 3600
    - task_key: ctr_metrics
      depends_on:
        - task_key: customer_advert_base
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/04_ctr_metrics
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          lookback_period: "30"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 3600
    - task_key: page_views
      depends_on:
        - task_key: customer_advert_base
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/05_page_views
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          lookback_period: "30"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 3600
    - task_key: purchases
      depends_on:
        - task_key: customer_advert_base
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/06_purchases
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          lookback_period: "30"
          year_lookback_period: "365"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 3600
    - task_key: customer_ad_exposure
      depends_on:
        - task_key: customer_advert_base
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/07_customer_advert_exposure
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          lookback_period: "30"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 3600
    - task_key: view_advert_affinity
      depends_on:
        - task_key: customer_advert_base
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/08_view_advert_affinity
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          lookback_period: "30"
          table_prefix: next_uk_nextads_analytics_pctr
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 3600
    - task_key: feature_build
      depends_on:
        - task_key: session_aggregation
        - task_key: ctr_metrics
        - task_key: page_views
        - task_key: purchases
        - task_key: customer_ad_exposure
        - task_key: view_advert_affinity
      notebook_task:
        notebook_path: ${workspace.file_path}/experiments/analytics_pctr/SQL/09_combining_data
        base_parameters:
          catalog_schema_prefix: "{{job.parameters.output_catalog}}.{{job.parameters.output_schema}}"
          table_prefix: next_uk_nextads_analytics_pctr
          output_table_name: _features
        source: WORKSPACE
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      timeout_seconds: 7200
    - task_key: validate_source_receipt
      depends_on:
        - task_key: feature_build
      spark_python_task:
        python_file: ../../../jobs/features/nextads/validate_analytics_pctr_source.py
        parameters:
          - --reference_date
          - "{{tasks.resolve_reference_date.values.reference_date}}"
          - --source_binding
          - "{{job.parameters.source_binding}}"
          - --source_catalog
          - "{{job.parameters.output_catalog}}"
          - --source_schema
          - "{{job.parameters.output_schema}}"
          - --producing_job_run_id
          - "{{job.run_id}}"
          - --receipt_correlation_id
          - "{{job.parameters.receipt_correlation_id}}"
          - --log_level
          - INFO
      job_cluster_key: next_ads_job_cluster_D32ads_v5_1_4
      libraries: ${var.feature_store_libraries}
      timeout_seconds: 1800

analytics_pctr_feature_source_config: &analytics_pctr_feature_source_config
  mktg_next_uk_nextads_analytics_pctr_feature_source:
    <<: *analytics_pctr_feature_source_job

targets:
  DEV:
    resources:
      jobs:
        <<: *analytics_pctr_feature_source_config
  DEV_FEATURE_STORE:
    resources:
      jobs:
        <<: *analytics_pctr_feature_source_config
